<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그때 그 추석 — 30년 전으로 떠나는 추석 하루살이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Shilla';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2206-02@1.0/Shilla_CultureM-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Shilla';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2206-02@1.0/Shilla_CultureB-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
  --bg:#F5F1E8; --card:#FBF8F1; --ink:#292723; --navy:#25364A; --accent:#C66A3D; --green:#76816D;
  --muted:rgba(41,39,35,.64); --line:rgba(41,39,35,.14); --soft:#EDE5D4;
  --btn-bg:#25364A; --btn-ink:#FBF8F1; --title:#25364A;
  --shadow:0 1px 0 rgba(41,39,35,.04), 0 14px 32px -22px rgba(37,54,74,.45);
  --font:'Shilla','Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --serif:'Shilla','Gowun Batang','Nanum Myeongjo','AppleMyungjo',serif;
  --num:'DM Serif Display',Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C222B; --card:#252C37; --ink:#EEE7D8; --muted:rgba(238,231,216,.66); --line:rgba(238,231,216,.15); --soft:#2E3643;
    --btn-bg:#EDE3CC; --btn-ink:#1C222B; --title:#EDE3CC; color-scheme:dark;
    --shadow:0 14px 32px -22px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#1C222B; --card:#252C37; --ink:#EEE7D8; --muted:rgba(238,231,216,.66); --line:rgba(238,231,216,.15); --soft:#2E3643;
  --btn-bg:#EDE3CC; --btn-ink:#1C222B; --title:#EDE3CC; color-scheme:dark;
  --shadow:0 14px 32px -22px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;word-break:keep-all;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;opacity:.07;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.16 0 0 0 0 0.15 0 0 0 0 0.13 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
h1:focus,h2:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:10px clamp(14px,3vw,32px);padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar[hidden]{display:none}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-weight:900;letter-spacing:-.02em;font-size:16px;white-space:nowrap}
.brand span{font-family:var(--num);font-size:15px;color:var(--accent);letter-spacing:.06em;white-space:nowrap}
.tl{display:flex;align-items:center;gap:6px;justify-self:center}
.tl-step{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--muted);padding:6px 10px;border-radius:999px;white-space:nowrap;transition:background .25s,color .25s}
.tl-step .e{font-size:15px;filter:saturate(.7)}
.tl-step.on{background:var(--btn-bg);color:var(--btn-ink);font-weight:700}
.tl-step.on .e{filter:none}
.tl-step.past{color:var(--ink)}
.tl-line{width:clamp(10px,3vw,36px);height:1px;background:var(--line)}
.tools{justify-self:end;display:flex;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:40px;white-space:nowrap;transition:transform .18s}
.chip:hover{transform:translateY(-1px)}
.chip .cnt{font-family:var(--num);font-size:16px;color:var(--accent)}
@media (max-width:760px){
  .topbar{grid-template-columns:1fr auto;row-gap:8px}
  .brand span{display:none}
  .tl{grid-column:1 / -1;grid-row:2;justify-self:stretch;justify-content:space-between}
  .tl-step{padding:5px 8px;font-size:13px}
  .tl-step:not(.on) .t{display:none}
  .chip .lbl{display:none}
}

/* ---------- layout ---------- */
main#stage{max-width:1180px;margin:0 auto;padding:clamp(18px,3.4vw,44px) clamp(16px,3vw,32px) 80px}
.screen{animation:enter .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.kicker{font-family:var(--num);font-size:clamp(20px,2.4vw,28px);color:var(--accent);letter-spacing:.02em;line-height:1}
.h1{font-size:clamp(30px,5vw,56px);font-weight:900;letter-spacing:-.035em;line-height:1.14;margin:.18em 0 .25em;color:var(--title)}
.h2{font-size:clamp(22px,3vw,32px);font-weight:900;letter-spacing:-.03em;line-height:1.2;margin:0 0 .4em;color:var(--title)}
.lead{font-family:var(--serif);font-size:clamp(17px,2vw,21px);color:var(--muted);margin:0;line-height:1.6}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(16px,2.4vw,28px)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- buttons ---------- */
.btn{appearance:none;border:0;font-weight:700;font-size:clamp(16px,1.6vw,18px);padding:15px 24px;border-radius:14px;background:var(--btn-bg);color:var(--btn-ink);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;letter-spacing:-.01em;
  transition:transform .2s ease,box-shadow .2s ease,opacity .2s;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px);box-shadow:0 0 0 rgba(0,0,0,0)}
.btn.accent{background:var(--accent);color:#FFF8EE}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{min-height:44px;padding:10px 16px;font-size:15px}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.btn .ar{transition:transform .2s}
.btn:hover .ar{transform:translateX(3px)}

/* ---------- intro ---------- */
.intro{min-height:calc(100vh - 120px);display:grid;place-items:center;text-align:center;position:relative}
.intro-inner{position:relative;z-index:1;display:grid;justify-items:center}
.moon-disc{position:absolute;left:50%;top:50%;width:min(78vw,560px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-58%);
  background:radial-gradient(circle at 42% 40%,#F6EBCF,#EEDDB6 60%,#E7D3A6);opacity:.75;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{transform:translate(-50%,-60%) scale(1.02)}}
.year{font-family:var(--num);font-size:clamp(120px,26vw,300px);line-height:.86;color:var(--title);letter-spacing:-.01em;margin:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .year{color:#25364A}}
:root[data-theme="dark"] .year{color:#25364A}
.intro .small{font-family:var(--serif);font-size:clamp(17px,2vw,21px);color:var(--muted);margin:18px 0 6px}
.intro .big{font-size:clamp(30px,5.4vw,58px);font-weight:900;letter-spacing:-.04em;line-height:1.16;margin:0 0 34px}
.intro .foot{margin-top:22px;font-size:14px;color:var(--muted)}

/* ---------- warp ---------- */
.warp{position:fixed;inset:0;z-index:150;background:var(--bg);display:grid;place-items:center;overflow:hidden}
.warp .num{font-family:var(--num);font-size:clamp(130px,30vw,360px);color:var(--title);line-height:1;will-change:transform}
.warp .scan{position:absolute;inset:0;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 2px,transparent 2px 4px)}
.warp.shake .num{animation:shake .12s linear infinite}
.warp.shake .scan{opacity:1}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-3px)}100%{transform:translate(0,0)}}
.warp.crt{animation:crt .7s cubic-bezier(.6,0,.3,1) both}
@keyframes crt{0%{transform:none;filter:none}35%{transform:scaleY(.012) scaleX(1.02);filter:brightness(2.2)}55%{transform:scaleY(.012) scaleX(.7);filter:brightness(2.2)}100%{transform:none;filter:none}}
.warp .land{animation:land .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes land{from{transform:scale(1.25);opacity:.2;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
.warp .caption{position:absolute;bottom:14vh;font-family:var(--serif);color:var(--muted);font-size:18px}

/* ---------- scenes ---------- */
.scene{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#EFE4CF;box-shadow:var(--shadow)}
.scene > svg{display:block;width:100%;height:auto}
.hot{cursor:pointer;outline:none}
.hot .ring{fill:none;stroke:#FFF8EE;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{opacity:.95;transform:scale(.55)}100%{opacity:0;transform:scale(1.45)}}
.hot .tag rect{fill:#25364A;transition:fill .2s}
.hot .tag text{fill:#FBF8F1;font-family:var(--font);font-weight:700}
.hot:hover .tag rect,.hot:focus-visible .tag rect{fill:#C66A3D}
.hot:focus-visible .tag rect{stroke:#FFF8EE;stroke-width:3}
.hot .tag{transition:transform .2s}
.hot:hover .tag{transform:translateY(-3px)}
.hot.done .ring{display:none}
.hot.done .tag rect{fill:#76816D}
.float{animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px)}}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:18px}
.choice{appearance:none;text-align:left;display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;padding:14px 18px 14px 14px;border-radius:16px;
  border:1px solid var(--line);background:var(--card);cursor:pointer;min-height:84px;transition:transform .2s,border-color .2s,box-shadow .2s;box-shadow:var(--shadow)}
.choice:hover{transform:translateY(-2px);border-color:var(--accent)}
.choice:active{transform:translateY(1px)}
.choice .ic{width:56px;height:56px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.choice .ic svg{width:46px;height:46px}
.choice b{display:block;font-size:17px;letter-spacing:-.02em}
.choice small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.choice .go{font-size:20px;color:var(--accent)}
.choice.done .go{color:var(--green);font-size:14px;font-weight:700}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.nextbar p{margin:0;color:var(--muted);font-size:15px}
.narr{position:absolute;left:clamp(10px,2vw,22px);bottom:clamp(10px,2vw,22px);max-width:min(430px,70%);background:rgba(251,248,241,.94);color:#292723;border-radius:14px;padding:12px 16px;font-family:var(--serif);font-size:clamp(14px,1.6vw,17px);line-height:1.55;box-shadow:0 8px 24px -14px rgba(0,0,0,.4)}

/* ---------- creator ---------- */
.creator{display:grid;grid-template-columns:minmax(260px,.9fr) 1.2fr;gap:clamp(18px,3vw,36px);align-items:start}
@media (max-width:820px){.creator{grid-template-columns:1fr}}
.preview{position:sticky;top:96px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);text-align:center;overflow:hidden}
@media (max-width:820px){.preview{position:relative;top:0}}
.preview .pv{height:clamp(240px,40vh,360px);display:grid;place-items:center;position:relative}
.preview .pv::before{content:"";position:absolute;left:50%;bottom:8%;width:62%;height:18%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(198,106,61,.18),transparent 70%)}
.preview .pv svg{height:100%;width:auto;position:relative}
.appear{animation:appear .45s cubic-bezier(.2,.8,.2,1)}
@keyframes appear{from{transform:translateY(14px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.nudge{animation:nudge .3s ease}
@keyframes nudge{40%{transform:scale(1.035) translateY(-3px)}}
.desc{font-family:var(--serif);color:var(--muted);font-size:16px;margin:10px 0 0;min-height:3em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.tab{appearance:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 15px;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap;min-height:42px}
.tab[aria-selected="true"]{background:var(--btn-bg);color:var(--btn-ink);border-color:transparent;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.opt{appearance:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 8px 12px;cursor:pointer;display:grid;justify-items:center;gap:6px;transition:transform .18s,border-color .18s}
.opt:hover{transform:translateY(-2px)}
.opt svg{width:84px;height:84px;background:var(--soft);border-radius:12px}
.opt span{font-size:14px;font-weight:500}
.opt[aria-checked="true"]{border:2px solid var(--accent);padding:9px 7px 11px}
.opt[aria-checked="true"] span{color:var(--accent);font-weight:700}

/* ---------- games ---------- */
.gbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.instr{font-size:clamp(19px,2.4vw,26px);font-weight:900;letter-spacing:-.03em;margin:0;color:var(--title)}
.step{font-family:var(--num);font-size:18px;color:var(--accent);white-space:nowrap}
.box{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);touch-action:manipulation}
.back{appearance:none;display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--ink) 28%,transparent);color:var(--ink);
  font-size:15px;font-weight:600;cursor:pointer;padding:9px 16px;min-height:42px;border-radius:12px;margin-bottom:14px;box-shadow:var(--shadow);transition:transform .18s,border-color .18s,background .18s}
.back:hover{border-color:var(--ink);background:var(--soft);transform:translateY(-1px)}
.back:active{transform:translateY(1px)}
.tok{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.tok.dragging{cursor:grabbing;z-index:20;filter:drop-shadow(0 12px 14px rgba(0,0,0,.25));transition:none!important}
.shakex{animation:shakex .35s}
@keyframes shakex{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{font-size:14px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:500}
.pill.ok{background:#76816D;color:#FBF8F1}

/* songpyeon */
.sp{display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:8px;padding:clamp(14px,3vw,34px);background:
  repeating-linear-gradient(90deg,rgba(120,84,50,.07) 0 2px,transparent 2px 44px),#E3C99C}
.sp .bowlbtn{appearance:none;border:0;background:none;display:grid;justify-items:center;gap:6px;padding:6px;border-radius:16px;color:#292723}
.sp .bowlbtn svg{width:min(150px,100%);height:auto}
.sp .bowlbtn span{font-weight:700;font-size:15px;background:rgba(251,248,241,.85);padding:4px 10px;border-radius:999px}
.sp .bowlbtn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.sp .bowlbtn.live{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{transform:translateY(-4px)}}
.palm{justify-self:center;width:min(300px,100%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#F3E6CC,#E6D2AE);display:grid;place-items:center;border:2px dashed rgba(41,39,35,.25);transition:border-color .2s,transform .2s}
.palm.over{border-color:#C66A3D;transform:scale(1.03)}
.palm svg{width:88%;height:88%}
.foldwrap{padding:16px clamp(14px,3vw,34px) 22px;display:grid;gap:10px}
.track{position:relative;height:56px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:rgba(198,106,61,.22)}
.track .knob{position:absolute;top:4px;left:4px;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px;cursor:grab;touch-action:none;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.swatches{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sw{appearance:none;border:2px solid transparent;border-radius:999px;padding:6px 12px 6px 6px;background:rgba(251,248,241,.85);display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer;color:#292723}
.sw i{width:22px;height:22px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.15)}
.sw[aria-checked="true"]{border-color:#C66A3D;font-weight:700}

/* charye */
.charye{padding:clamp(12px,2.4vw,28px);background:linear-gradient(#E9DDC6 0 62%,#D6B67E 62%)}
.byeong{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:720px;margin:0 auto;height:clamp(90px,16vw,150px)}
.byeong div{background:#F1E7D1;border:3px solid #7A5638;border-radius:2px;position:relative;overflow:hidden}
.byeong div::after{content:"";position:absolute;left:10%;right:10%;bottom:12%;height:40%;background:linear-gradient(135deg,transparent 45%,rgba(118,129,109,.45) 46% 60%,transparent 61%),linear-gradient(45deg,transparent 45%,rgba(118,129,109,.35) 46% 58%,transparent 59%)}
.table{max-width:720px;margin:-6px auto 0;background:#6E4630;border-radius:8px;padding:14px 12px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative;box-shadow:0 12px 0 -4px #53331F}
.slot{appearance:none;border:2px dashed rgba(255,248,238,.35);border-radius:14px;background:rgba(255,248,238,.06);min-height:clamp(96px,14vw,128px);display:grid;justify-items:center;align-content:end;gap:2px;padding:6px;cursor:pointer;color:#FBF8F1;transition:border-color .2s,background .2s}
.slot small{font-size:12.5px;opacity:.85}
.slot svg{width:clamp(56px,9vw,80px);height:auto}
.slot .ghost{opacity:.28;filter:grayscale(1)}
.slot.over,.slot.sel-target{border-color:#F1C58E;background:rgba(255,248,238,.14)}
.slot.filled{border-style:solid;border-color:rgba(255,248,238,.18)}
.tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:18px 12px 20px}
.tray .tok{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:8px 10px;display:grid;justify-items:center;gap:2px;min-width:96px;font-size:14px;font-weight:500}
.tray .tok svg{width:62px;height:62px}
.tray .tok[aria-pressed="true"]{border:2px solid var(--accent)}
.tray .tok.used{visibility:hidden}

/* tv */
.tvwrap{display:grid;grid-template-columns:1.6fr 1fr;gap:clamp(14px,3vw,30px);align-items:center;padding:clamp(16px,3vw,36px);background:#E9DCC4}
@media (max-width:720px){.tvwrap{grid-template-columns:1fr}}
.tvbox{background:linear-gradient(#8E6D4E,#7A5B3F);border-radius:22px;padding:18px;display:grid;grid-template-columns:1fr 92px;gap:14px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 18px 30px -20px rgba(0,0,0,.6);position:relative}
.tvbox::before,.tvbox::after{content:"";position:absolute;top:-58px;width:3px;height:64px;background:#4A3E33;border-radius:2px}
.tvbox::before{left:44%;transform:rotate(-24deg);transform-origin:bottom}
.tvbox::after{left:48%;transform:rotate(24deg);transform-origin:bottom}
.tvscreen{position:relative;border-radius:26px/22px;overflow:hidden;background:#222;aspect-ratio:4/3;box-shadow:inset 0 0 0 6px #3B3128}
.tvscreen canvas{width:100%;height:100%;display:block;image-rendering:auto}
.tvglass{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.18),transparent 45%);border-radius:inherit}
.tvside{display:grid;justify-items:center;align-content:start;gap:10px;background:#6A4F37;border-radius:12px;padding:12px 6px}
.chnum{font-family:var(--num);font-size:28px;color:#F3C875;background:#2A231F;border-radius:6px;width:62px;text-align:center;line-height:1.3}
.dial{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#D9D1C2,#9E968A);position:relative;cursor:grab;touch-action:none;box-shadow:0 3px 0 #3B3128;transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.dial-mark{position:absolute;left:50%;top:5px;width:6px;height:22px;margin-left:-3px;border-radius:3px;background:#2A231F}
.dialbtns{display:flex;gap:6px}
.dialbtns button{appearance:none;border:0;background:#2A231F;color:#F3E6CC;width:36px;height:36px;border-radius:8px;cursor:pointer}
.found{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.found li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(251,248,241,.8);color:#292723;font-weight:500}
.found li .n{font-family:var(--num);color:#C66A3D;width:30px;font-size:20px}
.found li.got{background:#25364A;color:#FBF8F1}
.found li.got .n{color:#F1C58E}

/* drive */
.drive{position:relative;aspect-ratio:16/8;min-height:280px;overflow:hidden;background:linear-gradient(#D9E0DC,#EFE6D2)}
.layer{position:absolute;left:0;width:200%;display:flex;pointer-events:none}
.layer svg{width:50%;height:100%;flex:none}
.l1{top:18%;height:40%;animation:pan 70s linear infinite}
.l2{top:34%;height:44%;animation:pan 26s linear infinite}
.l3{bottom:0;height:34%;animation:pan 7s linear infinite}
@keyframes pan{to{transform:translateX(-50%)}}
.spawn{position:absolute;inset:0}
.obj{position:absolute;appearance:none;border:0;background:none;padding:0;cursor:pointer;will-change:transform}
.obj svg{display:block;width:100%;height:auto}
.obj.got{pointer-events:none}
.obj.got svg{animation:gotit .5s forwards}
@keyframes gotit{to{opacity:0;transform:scale(1.15)}}
.frame{position:absolute;inset:0;pointer-events:none}
.checks{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--line)}

/* chat */
.chat{padding:clamp(16px,3vw,30px);display:grid;gap:12px;min-height:380px;align-content:start;background:linear-gradient(#3F3B37,#35312D)}
.bub{max-width:min(520px,86%);padding:12px 16px;border-radius:18px;font-size:16.5px;line-height:1.5;animation:enter .35s both}
.bub .who{display:block;font-size:12.5px;opacity:.7;margin-bottom:2px;font-weight:700}
.bub.them{background:#F3EBDA;color:#292723;border-bottom-left-radius:6px}
.bub.me{background:#C66A3D;color:#FFF8EE;justify-self:end;border-bottom-right-radius:6px}
.replies{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.replies .btn{background:#FBF8F1;color:#292723}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:#8a8378;animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.2}}

/* hunt */
.hunt .item{cursor:pointer}
.hunt .item:focus-visible{outline:none}
.hunt .item:focus-visible .mark{stroke:#C66A3D;stroke-dasharray:4 4;opacity:1}
.hunt .mark{fill:none;stroke:#C66A3D;stroke-width:4;opacity:0}
.hunt .item.got .mark{opacity:1;stroke-dasharray:none;animation:circle .5s ease}
@keyframes circle{from{stroke-dashoffset:260;stroke-dasharray:260}to{stroke-dashoffset:0;stroke-dasharray:260}}
.hunt .item.hinted .mark{opacity:1;stroke:#FFF8EE;animation:ring 1.2s ease-out 2}

/* jeon */
.pan-area{display:grid;place-items:center;padding:clamp(18px,4vw,40px);background:radial-gradient(circle at 50% 40%,#E8D8B8,#D8C19A)}
.pan{position:relative;width:min(420px,86vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 45% 40%,#4A4744,#2F2D2B 70%);box-shadow:inset 0 0 0 10px #252321,0 20px 30px -18px rgba(0,0,0,.6)}
.pan::after{content:"";position:absolute;right:-38%;top:46%;width:40%;height:8%;border-radius:8px;background:#5B4636}
.jeon{background:transparent;padding:0;position:absolute;width:30%;aspect-ratio:1;border-radius:50%;appearance:none;border:0;cursor:pointer;display:grid;place-items:center;transition:transform .25s}
.jeon .bar{position:absolute;bottom:-14px;left:10%;right:10%;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.jeon .bar i{position:absolute;inset:0;right:auto;width:0;background:#F1C58E}
.jeon .bar::after{content:"";position:absolute;left:55%;width:32%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.7);border-right:2px solid rgba(255,255,255,.7)}
.jeon.flip{animation:flip .4s ease}
@keyframes flip{50%{transform:translateY(-26px) scaleY(.1)}}
.jeon.gone{opacity:0;transform:scale(.4);pointer-events:none;transition:all .4s}
.sizzle{position:absolute;inset:-6%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,transparent 60%,rgba(255,255,255,.12) 62%,transparent 70%);animation:ring 1.4s infinite}

/* jegi */
.alley{position:relative;height:clamp(380px,56vh,520px);overflow:hidden;background:linear-gradient(#E5B98C 0%,#C9967A 45%,#B7A78C 45%,#CDBEA2 100%);cursor:pointer}
.alley .wallL,.alley .wallR{position:absolute;top:20%;bottom:40%;width:34%;background:repeating-linear-gradient(0deg,#B0674B 0 16px,#9E5A40 16px 18px);opacity:.85}
.alley .wallL{left:0}.alley .wallR{right:0}
.alley .me{position:absolute;bottom:4%;left:50%;width:clamp(110px,18vw,150px);transform:translateX(-50%)}
.alley .zone{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:clamp(150px,26vw,230px);height:44%;border-radius:50%;border:2px dashed rgba(255,248,238,.6)}
.alley .jg{position:absolute;left:50%;top:0;width:54px;margin-left:-27px;will-change:transform}
.score{position:absolute;right:16px;top:14px;font-family:var(--num);font-size:48px;color:#FFF8EE;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.score small{font-family:var(--font);font-size:14px;display:block;text-align:right}
.pop{position:absolute;left:50%;top:34%;transform:translateX(-50%);font-weight:900;font-size:26px;color:#FFF8EE;text-shadow:0 2px 0 rgba(0,0,0,.25);animation:popup .7s forwards;pointer-events:none;white-space:nowrap}
@keyframes popup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-34px)}}

/* shop */
.shop{display:grid;grid-template-columns:1.5fr 1fr;gap:0}
@media (max-width:760px){.shop{grid-template-columns:1fr}}
.shelf{padding:clamp(14px,3vw,28px);background:#E6D6B9;display:grid;grid-template-columns:repeat(3,1fr);gap:22px 10px}
.goods{appearance:none;border:0;box-shadow:0 10px 0 -3px #8A6243;background:rgba(251,248,241,.92);border-radius:14px;padding:8px 6px 10px;display:grid;justify-items:center;gap:0;cursor:pointer;color:#292723;transition:transform .18s;min-height:108px}
.goods:hover{transform:translateY(-2px)}
.goods svg{width:58px;height:58px}
.goods b{font-size:14px}
.goods small{font-family:var(--num);font-size:15px;color:#C66A3D}
.goods[disabled]{opacity:.4;cursor:not-allowed}
.wallet{padding:clamp(16px,3vw,28px);display:grid;gap:12px;align-content:start;border-left:1px solid var(--line)}
.won{font-family:var(--num);font-size:44px;line-height:1;color:var(--title)}
.basket{list-style:none;margin:0;padding:0;display:grid;gap:6px;min-height:60px}
.basket li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--soft);border-radius:10px;font-size:15px}
.basket li button{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 6px}

/* yut */
.yard{padding:clamp(16px,3vw,32px);background:radial-gradient(ellipse at 50% 30%,#D9C8A2,#C4AE84);display:grid;gap:18px;justify-items:center}
.mat{width:min(520px,100%);height:170px;border-radius:18px;background:#8E4A35;box-shadow:inset 0 0 0 6px #7A3E2C;display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vw,22px);position:relative}
.stick{width:clamp(28px,6vw,40px);height:130px;border-radius:20px;background:linear-gradient(90deg,#C9A06A,#E7C992 50%,#C9A06A);box-shadow:0 4px 0 rgba(0,0,0,.25);position:relative;transition:background .2s}
.stick.flat{background:#F1E1BD}
.stick.flat::before,.stick.flat::after{content:"✕";position:absolute;left:50%;transform:translateX(-50%);color:#8E4A35;font-weight:900;font-size:14px}
.stick.flat::before{top:22px}.stick.flat::after{bottom:22px}
.stick.toss{animation:toss .75s cubic-bezier(.3,.6,.4,1)}
@keyframes toss{30%{transform:translateY(-120px) rotate(200deg)}60%{transform:translateY(-60px) rotate(300deg)}100%{transform:none}}
.result-word{font-size:clamp(36px,7vw,64px);font-weight:900;letter-spacing:-.04em;color:#25364A;min-height:1.2em;line-height:1.2}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:min(520px,100%)}
.board i{aspect-ratio:1;border-radius:50%;background:rgba(251,248,241,.55);display:grid;place-items:center;font-style:normal;font-size:clamp(12px,2.6vw,18px)}
.board i.here{background:#25364A;color:#fff}

/* night */
.night{background:#16233A;border-radius:22px;overflow:hidden;position:relative;color:#FBF8F1;border:1px solid rgba(255,255,255,.06)}
.night svg{display:block;width:100%;height:auto}
.night .q{position:absolute;inset:0;display:grid;align-content:start;justify-items:start;text-align:left;padding:clamp(24px,5vw,56px);pointer-events:none}
.night .q h2{font-size:clamp(28px,5vw,54px);font-weight:900;letter-spacing:-.04em;line-height:1.16;margin:0 0 20px;text-shadow:0 2px 20px rgba(0,0,0,.4)}
.night .q .row{pointer-events:auto;justify-content:flex-start}
.feel{appearance:none;border:1px solid rgba(255,248,238,.35);background:rgba(22,35,58,.55);color:#FBF8F1;font-weight:700;font-size:17px;padding:14px 22px;border-radius:14px;cursor:pointer;min-height:54px;backdrop-filter:blur(6px);transition:transform .2s,background .2s}
.feel:hover{transform:translateY(-2px);background:rgba(198,106,61,.85)}
.night-wrap{position:relative}
@media (max-width:640px){.night .q{position:relative;background:#16233A;padding:24px 16px 28px;justify-items:center;text-align:center}.night .q .row{justify-content:center}.night .q h2{font-size:28px}}

/* result */
.result-hero{text-align:center;margin-bottom:18px}
.fusok{background:#F3ECDC;border-radius:22px;border:1px solid var(--line);padding:clamp(8px,1.6vw,16px);box-shadow:var(--shadow)}
.fusok svg{display:block;width:100%;height:auto;border-radius:14px}
.fusok .ico{opacity:0;animation:fade .6s forwards}
.card2{display:grid;grid-template-columns:1fr 1.1fr;gap:0;margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
@media (max-width:760px){.card2{grid-template-columns:1fr}}
.card2 > div{padding:clamp(18px,3vw,32px)}
.card2 h3{margin:0 0 14px;font-size:18px;letter-spacing:-.02em}
.tline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tline li{display:grid;grid-template-columns:64px 1fr;align-items:baseline;gap:10px;font-size:16.5px}
.tline time{font-family:var(--num);color:var(--accent);font-size:19px}
.sentence{background:var(--soft)}
.sentence p{font-family:var(--serif);font-size:clamp(17px,2vw,20px);line-height:1.85;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;justify-content:center}

/* gallery */
.gal{position:relative;overflow-x:auto;overflow-y:hidden}
@media (max-width:760px){.gal > svg{min-width:820px}}
.gal svg{display:block;width:100%;height:auto}
.gal .kid{cursor:pointer}
.gal .kid:focus-visible{outline:none}
.gal .kid:focus-visible .sel,.gal .kid.me .sel{opacity:1}
.gal .sel{opacity:0;fill:none;stroke:#FFF8EE;stroke-width:3;stroke-dasharray:6 5}
.gal .kid.new{animation:drop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
.galtools{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media (max-width:760px){.galtools{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 6px;font-size:17px}
.panel p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
textarea,.code{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);resize:vertical}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;user-select:all}
.popcard{position:absolute;z-index:5;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 18px 30px -16px rgba(0,0,0,.5);font-size:14px;min-width:190px;max-width:240px;animation:enter .25s}
.popcard ol{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:2px}
.popcard time{font-family:var(--num);color:var(--accent);margin-right:6px}

/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.cmp{grid-template-columns:1fr}}
.cmpcard{border-radius:20px;padding:clamp(20px,3vw,34px);border:1px solid var(--line);box-shadow:var(--shadow)}
.cmpcard .y{font-family:var(--num);font-size:clamp(56px,9vw,96px);line-height:.9;margin-bottom:14px}
.cmpcard ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cmpcard li{display:flex;gap:12px;align-items:center;font-size:17px;font-weight:500;padding:10px 0;border-bottom:1px solid rgba(41,39,35,.1)}
.cmpcard li:last-child{border-bottom:0}
.cmpcard li span{font-size:22px;width:30px;text-align:center}
.c96{background:#EEE3CC;color:#292723}
.c26{background:#25364A;color:#F2ECE0}
.c26 li{border-color:rgba(255,255,255,.12)}
.bigq{text-align:center;margin:clamp(28px,5vw,56px) auto 0;max-width:720px}
.bigq p{font-size:clamp(24px,3.8vw,40px);font-weight:900;letter-spacing:-.035em;line-height:1.3;margin:0 0 18px;color:var(--title)}

/* overlay, toast, drawer */
.overlay{position:fixed;inset:0;z-index:120;background:rgba(28,34,43,.5);display:grid;place-items:center;padding:20px;animation:fade .25s}
.dcard{background:var(--card);border-radius:22px;padding:clamp(24px,4vw,36px);max-width:440px;width:100%;text-align:center;animation:appear .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.dcard .art{width:120px;height:120px;margin:0 auto 10px;background:var(--soft);border-radius:50%;display:grid;place-items:center}
.dcard .art svg{width:90px;height:90px}
.dcard h2{margin:0 0 8px;font-size:clamp(24px,4vw,30px);font-weight:900;letter-spacing:-.03em;color:var(--title)}
.dcard p{margin:0 0 20px;font-family:var(--serif);color:var(--muted);font-size:16.5px;line-height:1.65}
.dcard .got{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:700;color:var(--green);margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:130;background:#25364A;color:#FBF8F1;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:500;box-shadow:0 16px 30px -16px rgba(0,0,0,.6);animation:toast 2.6s forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,16px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,92vw);z-index:125;background:var(--bg);border-left:1px solid var(--line);padding:calc(22px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));overflow:auto;animation:slidein .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.itm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;display:grid;justify-items:center;gap:4px;font-size:13px;font-weight:500;text-align:center}
.itm svg{width:56px;height:56px}
.itm.no svg{opacity:.18;filter:grayscale(1)}
.itm.no span{color:var(--muted)}
.imgview img{max-width:100%;border-radius:12px;display:block;margin:0 auto 14px;max-height:60vh}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .layer{animation:none!important}
}
</style>

<body>

</header>

<script>
'use strict';
/* =========================================================
   helpers
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

const wait=ms=>new Promise(r=>setTimeout(r,ms));
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function say(t){const l=$('#live');l.textContent='';setTimeout(()=>{l.textContent=t},30)}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function rng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

/* =========================================================
   sound (Web Audio, synthesized, off by default)
   ========================================================= */
const Sound={on:false,ctx:null,loops:[],
  ensure(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();return this.ctx},
  tone(f,d,type='sine',v=.04,delay=0,to){const c=this.ctx;if(!c)return;const t=c.currentTime+delay;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)},

function resetRun(){S.char={hair:0,hairColor:1,top:0,bottom:0,shoes:0,face:0,acc:0,hold:0};S.log=[];S.items=[];S.feeling=null;S.posted=false;updateBag()}
function done(id){return S.log.some(l=>l.id===id)}

function setTop(show,slot){const tb=$('#topbar');tb.hidden=!show;const idx=SLOTS.indexOf(slot);
  $$('.tl-step',tb).forEach((el,i)=>{el.classList.toggle('on',i===idx);el.classList.toggle('past',idx>=0?i<idx:slot==='all');if(i===idx)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current')})}
function go(fn,...args){
  S.cleanups.forEach(f=>{try{f()}catch(e){}});S.cleanups=[];Sound.stopLoops();closeOverlay();
  stage.innerHTML='';const el=document.createElement('section');el.className='screen';stage.appendChild(el);
  fn(el,...args);window.scrollTo(0,0);
  const h=el.querySelector('h1,h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}
}
function closeOverlay(){$$('.overlay,.drawer').forEach(e=>e.remove())}
function overlay(html,{onClose}={}){closeOverlay();const o=document.createElement('div');o.className='overlay';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.innerHTML=html;document.body.appendChild(o);
  const f=o.querySelector('button');f&&f.focus();o.addEventListener('keydown',e=>{if(e.key==='Escape'){o.remove();onClose&&onClose()}});return o}
function toast(t){$$('.toast').forEach(e=>e.remove());const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}
function onActivate(el,fn){el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(e)}})}

$('#bagBtn').addEventListener('click',()=>{

  logAct(id);const got=addItems(items);Sound.play('good');
  const a=ACTS[id];
  const o=overlay(`<div class="dcard"><div class="art">${icon(a.icon)}</div><h2>${title}</h2>${extra}<p>${FACT[id]}</p>

function hot(x,y,id,label,{r=30,tagDy=48,emoji=''}={}){
  const w=label.length*18+40, dn=done(id);
  return `<g class="hot ${dn?'done':''}" tabindex="0" role="button" aria-label="${label}${dn?' (했어요)':''}" data-go="${id}" transform="translate(${x} ${y})">
   <circle class="ring" r="${r}"/>${emoji?`<circle r="${r-6}" fill="#FBF8F1" stroke="#25364A" stroke-width="2"/><text text-anchor="middle" dy="8" font-size="22">${emoji}</text>`:`<circle r="8" fill="#FFF8EE" stroke="#25364A" stroke-width="2.5"/>`}
   <g class="tag"><rect x="${-w/2}" y="${tagDy-19}" width="${w}" height="38" rx="19"/><text text-anchor="middle" y="${tagDy+6}" font-size="18">${dn?'✓ ':''}${label}</text></g></g>`;
}
function apt(x,y,w,h,no,D,r){
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${D?'#B9AA98':'#E3D7C1'}"/><rect x="${x+w-16}" y="${y}" width="16" height="${h}" fill="${D?'#A39482':'#D2C5AB'}"/><rect x="${x-4}" y="${y-8}" width="${w+8}" height="10" fill="${D?'#8F8273':'#BDAE95'}"/>`;
  s+=`<text x="${x+14}" y="${y+34}" font-family="DM Serif Display, Georgia, serif" font-size="26" fill="${D?'#7C6E5E':'#9C8D77'}">${no}</text>`;
  const cols=Math.floor((w-70)/30), rows=Math.floor((h-60)/36);
  for(let j=0;j<rows;j++){for(let i=0;i<cols;i++){const wx=x+62+i*30, wy=y+22+j*36;const lit=D&&r()<.45;
    s+=`<rect x="${wx}" y="${wy}" width="20" height="16" fill="${lit?'#F3C875':(D?'#6F7479':'#9DA7A4')}"/><path d="M${wx-3} ${wy+19} h26" stroke="${D?'#8F8273':'#C8BBA2'}" stroke-width="3"/>`}}
  return s;
}

function gameHead(id,instr,step){return `<button class="back" id="backBtn">← 돌아가기</button><div class="gbar"><div><div class="kicker">${ACTS[id].time}</div><h1 class="instr" id="instr">${instr}</h1></div><span class="step" id="step">${step||''}</span></div>`}
function setInstr(t,step){const i=$('#instr');if(i)i.textContent=t;if(step!=null&&$('#step'))$('#step').textContent=step;say(t)}
function wireBack(el,id){$('#backBtn',el).onclick=()=>go(HUB[ACTS[id].slot])}
function inside(e,t){const r=t.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom}
function dragger(el,{onDrop,onOver,canDrag=()=>true}){
  let sx=0,sy=0,act=false,moved=false;el.classList.add('tok');
  el.addEventListener('pointerdown',e=>{if(!canDrag())return;act=true;moved=false;sx=e.clientX;sy=e.clientY;try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener('pointermove',e=>{if(!act)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)<6)return;moved=true;el.classList.add('dragging');el.style.transform=`translate(${dx}px,${dy}px)`;onOver&&onOver(e)});
  const end=e=>{if(!act)return;act=false;el.classList.remove('dragging');
    if(moved){const ok=onDrop(e);if(!ok){el.style.transition='transform .25s';el.style.transform='';setTimeout(()=>el.style.transition='',260)}else el.style.transform='';
      el.dataset.jd='1';setTimeout(()=>delete el.dataset.jd,60);onOver&&onOver(null)}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function popText(parent,t){const p=document.createElement('div');p.className='pop';p.textContent=t;parent.appendChild(p);setTimeout(()=>p.remove(),720)}

function gameShop(el){
  S.screen='g';const G=[['쫀드기',100,'ssondigi'],['풍선껌',50,'gum'],['딱지',200,'ddakji'],['구슬',300,'marble'],['종이 인형',200,'doll'],['뽑기',100,'ppopgi']];let basket=[];
  el.innerHTML=gameHead('shop','용돈 1,000원으로 사고 싶은 걸 골라요','')+`<div class="box shop"><div class="shelf" id="shelf"></div><div class="wallet"><div class="hint">남은 용돈</div><div class="won" id="won">1,000원</div><ul class="basket" id="bk"></ul><button class="btn accent" id="pay" disabled>계산하기</button><p class="hint" style="margin:0">할머니가 주신 용돈이에요. 동전 짤랑!</p></div></div>`;
  wireBack(el,'shop');
  const left=()=>1000-basket.reduce((s,n)=>s+G.find(g=>g[0]===n)[1],0);
  const render=()=>{const l=left();$('#shelf').innerHTML=G.map(([n,p,k])=>`<button class="goods" data-n="${n}" ${p>l?'disabled':''}>${icon(k)}<b>${n}</b><small>${p}원</small></button>`).join('');
    $('#won').textContent=l.toLocaleString()+'원';$('#bk').innerHTML=basket.length?basket.map((n,i)=>`<li><span>${n}</span><button data-r="${i}" aria-label="${n} 빼기">빼기</button></li>`).join(''):`<li style="background:none;color:var(--muted)">아직 고른 게 없어요</li>`;$('#pay').disabled=!basket.length};
  el.addEventListener('click',e=>{const g=e.target.closest('.goods');if(g&&!g.disabled){basket.push(g.dataset.n);Sound.play('coin');render();say(`${g.dataset.n} 담았어요`);const nb=$(`.goods[data-n="${g.dataset.n}"]`,el);nb&&!nb.disabled&&nb.focus()}
    const r=e.target.closest('[data-r]');if(r){basket.splice(+r.dataset.r,1);Sound.play('click');render()}});
  $('#pay').onclick=()=>{const l=left();finish('shop','장보기 완료!',[...new Set(basket)],`<div class="pill" style="margin-bottom:12px">거스름돈 ${l.toLocaleString()}원</div>`)};
  render();
}

/* 10. 윷놀이 */
function gameField(el){
  S.screen='g';let throws=3,pos=0,busy=false,alive=true;S.cleanups.push(()=>alive=false);
  el.innerHTML=gameHead('field','윷을 던져 말을 옮겨요','남은 기회 3번')+`<div class="box"><div class="yard"><div class="mat" id="mat">${'<div class="stick"></div>'.repeat(4)}</div>
   <div class="result-word" id="rw" aria-live="polite"></div><div class="board" id="board">${Array.from({length:20},(_,i)=>`<i>${i===19?'🏁':''}</i>`).join('')}</div>
   <button class="btn accent" id="throw" style="min-width:220px">🎲 윷 던지기</button></div></div>`;
  wireBack(el,'field');
  const NAME={1:['도',1],2:['개',2],3:['걸',3],4:['윷',4],0:['모',5]};
  const paint=()=>$$('#board i',el).forEach((c,i)=>{c.classList.toggle('here',i===pos);c.textContent=i===pos?'말':(i===19?'🏁':'')});paint();
  $('#throw').onclick=async()=>{if(busy||throws<=0)return;busy=true;$('#throw').disabled=true;Sound.play('yut');
    const st=$$('.stick',el);const flat=st.map(()=>Math.random()<.5);st.forEach((s,i)=>{s.classList.remove('toss','flat');void s.offsetWidth;s.style.animationDelay=(i*.05)+'s';s.classList.add('toss')});
    await wait(820);if(!alive)return;st.forEach((s,i)=>s.classList.toggle('flat',flat[i]));
    const n=flat.filter(Boolean).length;const [w,steps]=NAME[n];const bonus=n===4||n===0;
    $('#rw').textContent=`${w}! ${steps}칸${bonus?' · 한 번 더!':''}`;Sound.play(bonus?'good':'soft');
    for(let k=0;k<steps;k++){pos=Math.min(19,pos+1);paint();await wait(160)}
    if(!bonus)throws--;$('#step').textContent=`남은 기회 ${throws}번`;
    if(throws<=0||pos>=19){await wait(700);if(alive)finish('field',pos>=19?'말이 결승점 도착!':`윷놀이 끝! 말이 ${pos}칸 갔어요`,['윷']);return}
    busy=false;$('#throw').disabled=false;$('#throw').focus()};
}
const GAMES={songpyeon:gameSongpyeon,charye:gameCharye,tv:gameTV,window:gameWindow,talk:gameTalk,rest:gameRest,house:gameHouse,alley:gameAlley,shop:gameShop,field:gameField};

/* =========================================================
   card image
   ========================================================= */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function wrap(x,text,max){const words=text.split(' ');const out=[];let line='';words.forEach(w=>{const t=line?line+' '+w:w;if(x.measureText(t).width>max&&line){out.push(line);line=w}else line=t});if(line)out.push(line);return out}
function rrect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
async function renderCard(){
  const SANS='"Shilla", sans-serif',SERIF='"Shilla", serif',NUM='"DM Serif Display", Georgia, serif';
  const lines=sentenceLines();const txt=lines.join('')+S.log.map(l=>ACTS[l.id].label).join('')+'나의 1996년 추석 하루내가선택한그때그추석30년전으로떠나는추석하루살이';
  try{await Promise.all([document.fonts.load(`900 64px ${SANS}`,txt),document.fonts.load(`700 30px ${SANS}`,txt),document.fonts.load(`500 28px ${SANS}`,txt),document.fonts.load(`400 30px ${SERIF}`,txt),document.fonts.load(`700 22px ${SERIF}`,txt),document.fonts.load(`30px ${NUM}`,'0123456789:, SEPTMBR')])}catch(e){}
  const W=1080,P=64,artW=W-P*2,artH=Math.round(artW*.64),sx=artW/1000;
  const c=document.createElement('canvas'),x=c.getContext('2d');
  x.font=`400 31px ${SERIF}`;const wrapped=[];lines.forEach(l=>wrap(x,l,W-P*2-72).forEach(w=>wrapped.push(w)));
  const rows=Math.ceil(S.log.length/2);const artY=200,tY=artY+artH+80,sY=tY+64+rows*58+26,sH=110+wrapped.length*50;const H=sY+sH+110;
  c.width=W;c.height=H;x.fillStyle='#F5F1E8';x.fillRect(0,0,W,H);
  x.textBaseline='alphabetic';x.fillStyle='#C66A3D';x.font=`30px ${NUM}`;x.fillText('SEPTEMBER 27, 1996',P,86);
  x.fillStyle='#25364A';x.font=`900 64px ${SANS}`;x.fillText('나의 1996년 추석',P,162);
  x.textAlign='right';x.fillStyle='rgba(41,39,35,.6)';x.font=`500 24px ${SANS}`;x.fillText('그때 그 추석',W-P,86);x.textAlign='left';
  const img=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(fusokSVG(true)));
  x.save();rrect(x,P,artY,artW,artH,22);x.clip();x.drawImage(img,P,artY,artW,artH);x.restore();
  arcPoints(S.log.length).forEach((p,i)=>{const a=ACTS[S.log[i].id];const cx=P+p.x*sx,cy=artY+p.y*sx;x.textAlign='center';x.fillStyle='#C66A3D';x.font=`19px ${NUM}`;x.fillText(a.time,cx,cy+66*sx);x.fillStyle='#292723';x.font=`700 18px ${SERIF}`;x.fillText(a.label,cx,cy+88*sx)});
  x.textAlign='left';x.fillStyle='#25364A';x.font=`700 32px ${SANS}`;x.fillText('나의 추석 하루',P,tY);
  const colW=(W-P*2)/2;S.log.forEach((l,i)=>{const a=ACTS[l.id];const cx=P+(i<rows?0:colW),cy=tY+62+(i%rows)*58;x.fillStyle='#C66A3D';x.font=`30px ${NUM}`;x.fillText(a.time,cx,cy);x.fillStyle='#292723';x.font=`500 28px ${SANS}`;x.fillText(a.label,cx+104,cy)});
  x.fillStyle='#EDE5D4';rrect(x,P,sY,W-P*2,sH,24);x.fill();
  x.fillStyle='#25364A';x.font=`700 30px ${SANS}`;x.fillText('내가 선택한 추석',P+36,sY+62);
  x.fillStyle='#292723';x.font=`400 31px ${SERIF}`;wrapped.forEach((w,i)=>x.fillText(w,P+36,sY+118+i*50));
  x.textAlign='center';x.fillStyle='rgba(41,39,35,.55)';x.font=`500 22px ${SANS}`;x.fillText('그때 그 추석 · 30년 전으로 떠나는 추석 하루살이',W/2,H-48);
  return c;
}
async function saveCard(btn){
  const old=btn.innerHTML;btn.disabled=true;btn.textContent='카드 만드는 중…';
  try{const cv=await renderCard();const blob=await new Promise(r=>cv.toBlob(r,'image/png'));let handled=false;
    try{const use=window.claude&&typeof window.claude.use==='function'?window.claude.use('downloads'):null;const dl=use?await Promise.race([use,wait(4000).then(()=>null)]):null;
      if(dl&&blob){await dl.save({filename:'나의-1996년-추석.png',data:blob});handled=true;toast('카드를 저장했어요.')}}
    catch(e){if(e&&e.code==='declined'){handled=true}else if(e&&e.code==='rate_limited'){handled=true;toast('잠시 후 다시 눌러 주세요.')}}
    if(!handled){const url=cv.toDataURL('image/png');const o=overlay(`<div class="dcard imgview" style="max-width:520px"><h2>나의 추석 카드</h2><img src="${url}" alt="나의 1996년 추석 카드"><p>이미지를 길게 누르거나 마우스 오른쪽 버튼으로 저장하세요.</p><div class="row" style="justify-content:center"><a class="btn accent" href="${url}" download="나의-1996년-추석.png" style="text-decoration:none">PNG 다운로드</a><button class="btn ghost" id="cl">닫기</button></div></div>`);$('#cl',o).onclick=()=>o.remove()}}
  catch(e){toast('카드를 만들지 못했어요. 다시 눌러 주세요.')}
  btn.disabled=false;btn.innerHTML=old;
}
